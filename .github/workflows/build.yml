name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
  
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Setup Gorilla Tag
        uses: sirkingbinx/setup-gorilla-tag@1.0.0

      - name: Build Solution
        run: dotnet build -c Debug -o ./build -p:CI=TRUE

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./Build/Translatilla.zip

      - name: Publish to MonkeForge dev channel
        if: github.ref == 'refs/heads/dev'
        uses: sirkingbinx/monkeforge-ci@1.0.0
        with:
          api-key: ${{ secrets.MONKEFORGE_API_KEY }}
          mod-id: dev.sirkingbinx.translatilla
          version: 0.0.0-dev.${{ github.run_number }}
          channel: dev
          files: ./Build/Translatilla.zip
          notes: "Automated build from https://github.com/sirkingbinx/Translatilla/commit/${{ github.sha }}"